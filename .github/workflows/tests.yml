name: Tests

on:
  push:
    branches: ['**']
    paths:
      - 'index.html'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/tests.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/tests.yml'
  workflow_dispatch:

jobs:
  test:
    name: Suite (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # jsdom 30 pulls in whatwg-url 17 / undici, which need Node >= 22.
        # Node 20 fails at require time with
        # "webidl.util.markAsUncloneable is not a function".
        node-version: ['22', '24']

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      # The matrix jobs never launch a browser, so skip the download the
      # playwright package would otherwise do on install.
      - name: Install dependencies
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      # No build step; the suites read index.html and assets/ directly.
      # The browser suite skips itself here — it gets a dedicated job below so
      # a browser download is not repeated across the version matrix.
      - name: Run tests
        run: npm test

  browser:
    name: Browser (Chromium)
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # REQUIRE_BROWSER makes a missing browser a failure rather than a skip,
      # so a misconfigured runner cannot silently drop this coverage.
      - name: Run browser suite
        run: npm run test:browser
        env:
          REQUIRE_BROWSER: '1'
