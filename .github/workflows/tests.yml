name: Tests

on:
  push:
    branches: ['**']
    paths:
      - 'index.html'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/tests.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/tests.yml'
  workflow_dispatch:

jobs:
  test:
    name: Suite (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # jsdom 30 pulls in whatwg-url 17 / undici, which need Node >= 22.
        # Node 20 fails at require time with
        # "webidl.util.markAsUncloneable is not a function".
        node-version: ['22', '24']

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The app has no build step; the suite loads index.html directly.
      - name: Run tests
        run: npm test
